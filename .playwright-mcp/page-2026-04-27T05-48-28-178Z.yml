        - generic [ref=e52]: "또 하나 재밌었던 점은 압축 해제 결과의 시작과 끝만 보면 전부 `0`이라서 플래그가 없는 것처럼 보인다는 점이다. 이때 샘플링만 하고 끝내면 놓칠 수 있다. 전체에서 `0`이 아닌 바이트의 위치를 세어 보니 중간에 딱 플래그가 숨어 있었다. ## 최종 정리 이번 문제에서 배운 점은 세 가지다. 1. 확장자가 없어도 매직 바이트를 보면 파일 형식을 추측할 수 있다. 2. 압축 파일은 바로 풀기 전에 크기와 형식을 먼저 의심해야 한다. 3. 큰 파일을 다룰 때는 전체를 메모리나 디스크에 올리는 방식보다 스트리밍 분석이 더 안전하다. 풀이 자체는 짧았지만, misc 문제답게 \"도구를 얼마나 많이 아느냐\"보다 \"파일을 어떻게 조심스럽게 관찰하느냐\"를 묻는 문제였다. 다음부터 수상한 파일을 만나면 일단 실행이 아니라 관찰부터 해야겠다. ## 참고 - Dreamhack Wargame 2833: https://dreamhack.io/wargame/challenges/2833 - Python `lzma` 공식 문서: https://docs.python.org/3/library/lzma.html - XZ Utils 파일 형식 문서: https://tukaani.org/xz/xz-file-format.txt"
