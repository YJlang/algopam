        - generic [ref=e58]: "예제는 둘 다 통과했는데 제출하면 일부 케이스가 틀리는 문제였다. 처음에는 `goal`을 거꾸로 돌면서 카드 뭉치의 **뒤에서부터** 맞춰봤는데, 알고 보니 이 문제의 핵심은 **카드를 뭉치의 앞(맨 위)에서부터만 꺼낼 수 있다**는 점이었다. 방향을 반대로 잡으니 예제는 우연히 맞고 숨은 테스트에서 터졌다. 문제 링크: https://school.programmers.co.kr/learn/courses/30/lessons/159994 ## 문제 정보 - 출처: 프로그래머스 코딩테스트 연습 - 난이도/유형 감각: Lv.1, 스택/큐 (그리디 + 투 포인터) - 문제 번호: 159994 ## 문제 설명 두 개의 카드 뭉치 `cards1`, `cards2`가 있다. 각 뭉치의 카드는 **맨 앞에서부터 순서대로 한 장씩만** 사용할 수 있다. 규칙은 이렇다. - 한 번 사용한 카드는 다시 사용할 수 없다. - 카드를 건너뛰고 더 뒤의 카드를 먼저 쓸 수 없다. (각 뭉치 안에서 순서 고정) - 두 뭉치 중 어느 쪽 카드를 쓸지는 자유롭게 고를 수 있다. 이 규칙을 지키면서 카드를 뽑아 목표 문자열 배열 `goal`을 순서대로 만들 수 있으면 `\"Yes\"`, 만들 수 없으면 `\"No\"`를 반환한다. ## 입력 / 제한사항"
