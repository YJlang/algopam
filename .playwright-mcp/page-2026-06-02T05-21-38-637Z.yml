      - code [ref=e248]: "def solution(cards1, cards2, goal): i = 0 # cards1에서 다음에 꺼낼 '맨 앞' 카드의 위치 j = 0 # cards2에서 다음에 꺼낼 '맨 앞' 카드의 위치 for word in goal: # goal을 앞에서부터 한 단어씩 if i < len(cards1) and cards1[i] == word: i += 1 # cards1의 맨 앞 카드를 사용 elif j < len(cards2) and cards2[j] == word: j += 1 # cards2의 맨 앞 카드를 사용 else: return \"No\" # 두 뭉치 맨 앞 어느 쪽도 못 맞추면 불가능 return \"Yes\""
