      - code [ref=e198]: "def solution(cards1, cards2, goal): answer = '' c1 = len(cards1) # cards1에서 아직 안 쓴 카드 개수 (뒤에서부터 본다) c2 = len(cards2) # cards2에서 아직 안 쓴 카드 개수 for i in reversed(goal): # goal을 뒤에서부터 본다 if c1 > 0 and cards1[c1-1] == i: # cards1의 '마지막' 카드와 비교 c1 -= 1 elif c2 > 0 and cards2[c2-1] == i: # cards2의 '마지막' 카드와 비교 c2 -= 1 else: answer = 'No' break if answer == '': answer = 'Yes' return answer"
