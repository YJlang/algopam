        - generic [ref=e52]: "## 시간 / 공간 복잡도 여기서 `n`은 `goal`의 길이다. (제한상 `n`은 최대 `cards1 길이 + cards2 길이`, 즉 최대 20 정도로 아주 작다.) - 오답(뒤에서부터): `O(n)` - 정답(앞에서부터): `O(n)` 두 풀이 모두 `goal`을 딱 한 번만 훑고, 각 단계에서 하는 일은 길이 10 이하의 단어 한두 번 비교가 전부다. 단어 비교는 길이가 상수(≤10)로 묶여 있어 상수 시간으로 본다. 그래서 입력이 커져도 `goal` 길이에 정비례하는 `O(n)`이다. 입력이 대략 두 배가 되면 비교 횟수도 대략 두 배가 되는 정도이고, 중첩 반복으로 모든 쌍을 비교하는 `O(n^2)` 구조가 아니다. 공간 복잡도는 `O(1)`이다. 두 풀이 모두 포인터(또는 남은 개수) 변수 몇 개만 쓰고, 입력 크기에 비례하는 추가 자료구조를 만들지 않는다. ## 이번 문제에서 배운 점 - 예제가 전부 통과해도 안심하면 안 된다. 특히 이 문제처럼 예제가 \"카드를 전부 쓰는\" 특수 케이스만 담고 있으면, 잘못된 방향의 풀이도 예제는 통과한다. - 제한사항의 `2 ≤ goal 길이 ≤ 전체 길이`처럼 \"안 써도 되는 경우\"를 알려주는 한 줄을 반드시 반례로 떠올려 봐야 한다. - 카드/스택처럼 \"한쪽 끝에서만 꺼낼 수 있는\" 문제는 **꺼내는 방향**이 곧 풀이의 정답/오답을 가른다. 투 포인터를 쓰느냐보다 어느 쪽 끝을 가리키느냐가 더 중요했다. - 두 뭉치의 단어가 서로 겹치지 않는다는 제한 덕분에, \"맞으면 바로 그 뭉치를 쓴다\"는 단순 그리디가 애매함 없이 항상 옳다는 점도 같이 챙기면 좋다."
