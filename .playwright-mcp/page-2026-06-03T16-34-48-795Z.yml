        - heading "원래 작성했던 코드" [level=2] [ref=e175]
        - paragraph [ref=e176]: 처음엔 "5보다 크면 올리고, 아니면 내린다"로 단순하게 분기했다. 예제 16, 2554가 둘 다 맞길래 통과인 줄 알았다.
        - code [ref=e178]: "def solution(storey): answer = 0 while storey > 0: digit = storey % 10 if digit > 5: # 5 '초과'일 때만 올림 answer += 10 - digit storey += 10 # +10 후 //10 → 윗자리로 +1 받아올림 (이 부분은 정상) else: # 0~5는 전부 내림 처리 ← digit == 5도 여기로 빠진다 (버그) answer += digit storey //= 10 return answer"
        - heading "이 코드에서 하려던 것" [level=2] [ref=e179]
        - paragraph [ref=e180]:
          - text: 의도 자체는 위 접근 아이디어와 같았다. 그리고 사실
          - strong [ref=e181]: 두 부분은 맞게 짰다.
        - list [ref=e182]:
          - listitem [ref=e183]:
            - code [ref=e184]: digit > 5
            - text: 일 때
            - code [ref=e185]: answer += 10 - digit
            - text: 로 올림 비용을 더한 것 — 맞다.
          - listitem [ref=e186]:
            - code [ref=e187]: storey += 10
            - text: 후 루프 끝에서
            - code [ref=e188]: storey //= 10
            - text: 하는 것 —
            - code [ref=e189]: (storey + 10) // 10 == storey // 10 + 1
            - text: 이라
            - strong [ref=e190]: 받아올림(+1)이 정확히 반영
            - text: 된다. 맞다.
        - paragraph [ref=e191]:
          - text: 진짜 문제는 단 하나,
          - strong [ref=e192]:
            - code [ref=e193]: digit == 5
            - text: 가
            - code [ref=e194]: else
            - text: 로 빠져서 "무조건 내림"으로 처리
          - text: 된다는 점이다.
          - code [ref=e195]: if digit > 5
          - text: 는 5를 포함하지 않으므로 5는 항상 내려버린다.
        - heading "약했던 점과 반례" [level=2] [ref=e196]
        - paragraph [ref=e197]:
          - code [ref=e198]: d == 5
          - text: 일 때 윗자리가 5 이상이면
          - strong [ref=e199]: 올리는 게 이득
          - text: 인데, 원래 코드는 이 경우를 절대 잡지 못한다. 예제(16, 2554)에는 마침 이 상황이 없어서 통과했을 뿐이다.
        - code [ref=e201]: 입력 storey = 65
        - code [ref=e203]: "잘못된 출력: 10 정답: 9"
        - paragraph [ref=e204]: "원래 코드의 실행을 따라가 보면:"
        - code [ref=e206]: 65 | digit 5 → else(내림) +5 (=5) → storey 6 6 | digit 6 → 올림 +4 (=9), +10→16 → //10 → 1 1 | digit 1 → else(내림) +1 (=10) → 0 → 10
        - paragraph [ref=e207]:
          - text: 하지만 65는
          - code [ref=e208]: "+1"
          - text: 을 5번 눌러 70으로 올리고(받아올림), 70 → 100 → 0으로 가면
          - code [ref=e209]: 5 + 3 + 1 = 9
          - text: 번이면 된다. 일의 자리 5에서
          - strong [ref=e210]: 올렸어야
          - text: 했다.
        - paragraph [ref=e211]:
          - text: 같은 이유로
          - code [ref=e212]: "555"
          - text: 도 깨진다.
        - code [ref=e214]: 입력 storey = 555
        - code [ref=e216]: "잘못된 출력: 15 (5+5+5, 전부 내림) 정답: 14 (555→56→6→1: 5+4+4+1)"
        - 'heading "개선 풀이 1: 그리디 + d==5일 때 윗자리 확인" [level=2] [ref=e217]'
        - paragraph [ref=e218]:
          - code [ref=e219]: d == 5
          - text: 인 경우만 분리해서,
          - strong [ref=e220]: 바로 윗자리 숫자가 5 이상이면 올림
          - text: ", 아니면 내림으로 처리한다. (윗자리도 5 이상이면 어차피 올라갈 자리라, 미리 +1 받아두는 쪽이 더 싸기 때문이다.)"
        - code [ref=e222]: "def solution(storey): answer = 0 while storey > 0: d = storey % 10 # 맨 끝자리 if d < 5: # 작으면 → 내림 answer += d storey //= 10 # 올림 없이 윗자리로 elif d > 5: # 크면 → 올림 answer += 10 - d storey = storey // 10 + 1 # 윗자리로 +1 받아올림 else: # d == 5 if (storey // 10) % 10 >= 5: # 윗자리도 크면 올리는 게 이득 answer += 5 storey = storey // 10 + 1 else: # 아니면 그냥 내림 answer += 5 storey //= 10 return answer"
        - paragraph [ref=e223]:
          - text: 핵심은
          - code [ref=e224]: storey // 10
          - text: (올림 없음) vs
          - code [ref=e225]: storey // 10 + 1
          - text: (올림 있음)의 차이다. 코드가 짧고 직관적이지만,
          - code [ref=e226]: d == 5
          - text: 의 타이브레이크를 직접 다뤄야 해서 처음 실수한 바로 그 지점이다.
        - 'heading "개선 풀이 2: DP — \"올림을 내보낼지\" 두 상태로 들고 가기" [level=2] [ref=e227]'
        - paragraph [ref=e228]:
          - code [ref=e229]: "5"
          - text: 의 타이브레이크가 찜찜하다면,
          - strong [ref=e230]: 각 자리에서 내림/올림 둘 다 고려
          - text: 하고 최솟값만 들고 가는 DP가 더 안전하다. 자릿수를 낮은 자리부터 보면서 두 상태를 유지한다.
        - list [ref=e231]:
          - listitem [ref=e232]:
            - code [ref=e233]: keep
            - text: ": 지금까지 처리한 아랫자리들이"
            - strong [ref=e234]: 윗자리로 올림을 내보내지 않은
            - text: 경우의 최소 비용
          - listitem [ref=e235]:
            - code [ref=e236]: up
            - text: ": 아랫자리들이"
            - strong [ref=e237]: 윗자리로 +1 올림을 내보낸
            - text: 경우의 최소 비용
        - code [ref=e239]: "def solution(storey): keep, up = 0, float('inf') # keep: 올림 없음, up: 윗자리로 +1 올림 for ch in reversed(str(storey)): # 낮은 자리 → 높은 자리 d = int(ch) # 올림이 들어오면 이 자리의 실제 값은 d+1이 된다 new_keep = min(keep + d, up + (d + 1)) # 이 자리에서 올림을 안 내보냄 new_up = min(keep + (10 - d), up + (10 - (d + 1))) # 이 자리에서 윗자리로 올림 keep, up = new_keep, new_up return min(keep, up + 1) # 최상위에서 올림이 남으면 -10^k 한 번 더(+1)"
        - paragraph [ref=e240]:
          - text: 마지막에
          - code [ref=e241]: up + 1
          - text: "을 비교하는 이유: 최상위 자리에서까지 올림이 남으면(예: 95 → 100) 한 자리 위로 올라간 셈이라"
          - code [ref=e242]: "-10^k"
          - text: "를 한 번 더 눌러야 하기 때문이다. (예:"
          - code [ref=e243]: 95 → +1×5 → 100 → -100 → 0
          - text: ", 6번.)"
        - paragraph [ref=e244]:
          - code [ref=e245]: d == 5
          - text: 같은 특수 분기가 전혀 없다. 매 자리에서 "내림/올림"을 모두 펼쳐 min을 취하므로,
          - strong [ref=e246]: 올림이 윗자리에 미치는 영향까지 자동으로 반영
          - text: 된다. 그리디의 타이브레이크 규칙을 외우지 않아도 된다는 게 장점이고, 대신 상태 두 개를 들고 가는 점화식을 세워야 한다.
        - heading "시간 복잡도와 공간 복잡도" [level=2] [ref=e247]
        - paragraph [ref=e248]:
          - text: 여기서
          - code [ref=e249]: "n"
          - text: 은
          - strong [ref=e250]:
            - code [ref=e251]: storey
            - text: 의 자릿수
          - text: (= ⌊log₁₀(storey)⌋ + 1)다.
          - code [ref=e252]: storey ≤ 1억
          - text: 이므로
          - code [ref=e253]: n ≤ 9
          - text: .
        - table [ref=e254]:
          - rowgroup [ref=e255]:
            - row "풀이 시간 복잡도 공간 복잡도 한 줄 메모" [ref=e256]:
              - columnheader "풀이" [ref=e257]
              - columnheader "시간 복잡도" [ref=e258]
