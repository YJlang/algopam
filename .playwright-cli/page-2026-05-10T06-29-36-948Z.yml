      - generic [ref=e52]: "- `GRANT`는 권한 부여, `REVOKE`는 권한 취소다. ### 4. 운영체제와 네트워크 - ICMP는 IP 통신 중 오류와 제어 메시지를 전달한다. - 세마포어는 임계 구역 접근을 제어한다. - Best Fit은 들어갈 수 있는 공간 중 가장 작은 공간을 고른다. - 프로세스와 메모리 관리는 쉘이 아니라 커널의 역할이다. ### 5. 정보시스템 구축 관리 - 간트 차트의 막대 길이는 작업 기간이다. - `wtmp`는 로그인/로그아웃 기록과 관련 있다. - DPI는 패킷 내부 콘텐츠까지 깊게 검사한다. - 테일러링은 프로젝트 특성에 맞게 방법론을 조정하는 것이다. --- ## 오늘의 결론 이번 3회차 오답은 대부분 “처음 보는 개념”이라기보다, 이미 본 적 있는 용어의 **정확한 역할**을 묻는 문제였다. 특히 다음 표현들은 다시 나오면 바로 반응할 수 있게 반복해야겠다. 1. `상향식 설계`: 하위 모듈을 먼저 만들고 조립한다. 인터페이스가 중요하다. 2. `목업`: 실제 동작보다 화면 모양을 정적으로 확인한다. 3. `REVOKE`: 권한을 취소한다. 4. `ICMP`: IP 오류와 제어 메시지를 전달한다. 5. `간트 차트`: 수평 막대는 작업 기간이다. 정답만 보면 금방 지나가지만, 오답을 다시 내 말로 풀어 쓰면 어떤 단어에서 흔들렸는지 보인다. 다음 회차를 풀 때는 문제의 긴 문장보다 “이 보기에서 핵심 역할이 무엇인지”를 먼저 잡아야겠다."
